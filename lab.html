<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="stylesheet" href="css/style.css">
<script src="https://batyunching.github.io/bio/js/account.js" data-chapter="ch3" data-prefix="ch3."></script>
<style>
  .lab-tabs{ display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:18px; }
  @media (max-width:760px){ .lab-tabs{ grid-template-columns:1fr; } }
  .lab-tab{ text-align:left; background:#fff; border:3px solid var(--c-line); border-radius:18px; padding:12px 16px; cursor:pointer; font-family:inherit; color:inherit; min-height:72px; position:relative; }
  .lab-tab b{ display:block; font-size:1.05rem; }
  .lab-tab small{ color:var(--c-muted); }
  .lab-tab[aria-pressed="true"]{ border-color:var(--u); background:var(--u-l); }
  .lab-tab .ok{ position:absolute; right:12px; top:10px; background:var(--c-ok); color:#fff; border-radius:999px; font-size:.75rem; padding:2px 10px; font-weight:900; display:none; }
  .lab-tab.done .ok{ display:block; }
  .stepper{ display:flex; gap:6px; flex-wrap:wrap; margin:0 0 16px; }
  .stepper button{ flex:1; min-width:110px; min-height:48px; border-radius:14px; border:2px solid var(--c-line); background:#fff; font-family:inherit; font-weight:700; cursor:pointer; color:inherit; font-size:.92rem; }
  .stepper button[aria-current="true"]{ background:var(--u); border-color:var(--u); color:#fff; }
  .stepper button.visited:not([aria-current="true"]){ border-color:var(--u); color:var(--u-d); }
  .stepper button:disabled{ opacity:.4; cursor:not-allowed; }
  .panel{ display:none; } .panel.on{ display:block; animation:fadeIn .3s ease; }
  @keyframes fadeIn{ from{ opacity:0; transform:translateY(6px);} to{ opacity:1; transform:none; } }
  .purpose{ font-size:1.15rem; line-height:1.8; }
  .mat{ display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:10px; }
  .mat label{ display:flex; align-items:center; gap:10px; background:#fff; border:2px solid var(--c-line); border-radius:14px; padding:10px 14px; min-height:56px; cursor:pointer; font-weight:700; }
  .mat input{ width:24px; height:24px; accent-color:var(--u); }
  .mat label.chk{ border-color:var(--u); background:var(--u-l); }
  .mat .em{ font-size:1.5rem; }
  .navrow{ display:flex; justify-content:space-between; gap:10px; margin-top:18px; flex-wrap:wrap; }
  .qa{ display:grid; gap:12px; }
  .qa .q{ background:#fff; border-radius:16px; padding:14px 18px; border-left:6px solid var(--u); box-shadow:var(--shadow); }
  .qa .a{ display:none; margin-top:8px; background:var(--u-l); border-radius:12px; padding:10px 14px; }
  .qa .q.open .a{ display:block; }
  .concl{ background:linear-gradient(135deg,var(--u-l),#fff); border:3px solid var(--u); border-radius:22px; padding:22px; }
  .concl h3{ color:var(--u-d); }
  .subtabs{ margin-bottom:12px; }
  .warn{ background:#FFF3E0; border:2px solid #FB8C00; border-radius:14px; padding:10px 14px; font-weight:700; color:#E65100; margin-top:10px; }
  .good{ background:#E8F5E9; border:2px solid var(--c-ok); border-radius:14px; padding:10px 14px; font-weight:700; color:var(--c-ok); margin-top:10px; }
  .tool{ display:inline-flex; align-items:center; gap:8px; min-height:52px; padding:8px 16px; border-radius:16px; border:2px dashed var(--u); background:#fff; font-family:inherit; font-weight:900; cursor:grab; touch-action:none; user-select:none; color:inherit; font-size:1rem; }
  .tool.sel{ background:var(--u); color:#fff; border-style:solid; }
  .tool.placed{ opacity:.4; cursor:default; }
  .drag-ghost{ position:fixed; z-index:300; pointer-events:none; transform:translate(-50%,-50%); font-size:2.2rem; filter:drop-shadow(0 4px 8px rgba(0,0,0,.3)); }
  .ops{ display:flex; flex-wrap:wrap; gap:8px; margin:10px 0; }
  .datatable{ width:100%; border-collapse:collapse; background:#fff; margin-top:10px; }
  .datatable th,.datatable td{ border:1px solid var(--c-line); padding:8px; text-align:center; }
  .datatable th{ background:var(--u-l); color:var(--u-d); }
  .datatable input{ width:70px; min-height:40px; font-size:1rem; text-align:center; border:2px solid var(--c-line); border-radius:10px; font-family:inherit; }
  .bigcount{ font-size:2.6rem; font-weight:900; color:var(--u-d); text-align:center; }
  .stamina{ height:16px; border-radius:999px; background:#ECEFF1; overflow:hidden; }
  .stamina span{ display:block; height:100%; background:linear-gradient(90deg,#E53935,#FDD835 40%,#43A047 70%); transition:width .3s; }
  .checklist label{ display:flex; gap:8px; align-items:center; min-height:40px; }
  .checklist input{ width:22px; height:22px; accent-color:var(--u); }
</style>
</head>

    <button class="lab-tab" data-e="33" aria-pressed="false"><span class="ok">✓ 完成</span><b>實驗 3-3</b><small>血液流動的觀察</small></button>

<script>
/* ===== 實驗內容（文字） ===== */
var LAB = {
  '31': { unit:'unit-31', title:'實驗 3-1 觀察植物體內的水分運輸',
    purpose:'觀察植物體內<b>運輸水分的構造</b>，以及探究<b>影響蒸散作用的因素</b>。',
    mats:[['🥬','芹菜 ×3'],['🔪','小刀 ×1'],['🟩','切割墊 ×1'],['🔴','食用色素 適量'],['🔍','放大鏡（或解剖顯微鏡）×1'],['🧪','10 mL 量筒 ×2'],['🪣','水盆 ×1'],['💧','滴管 ×1'],['🩹','膠帶 ×1'],['⚗️','250 mL 錐形瓶 ×1']],
    ops:[['一、觀察運輸水分的構造','sim31a'],['二、葉片有無對蒸散作用的影響','sim31b'],['延伸探討：花瓣的維管束','sim31c']],
    qa:[
      ['步驟中為何必須在水中切取芹菜？','若在空氣中切取，<b>空氣會進入切口的維管束形成氣泡</b>，阻斷連續的水柱，水分就不容易向上運輸。'],
      ['芹菜葉柄中染成紅色的部分，是維管束中的哪一個構造？','<b>木質部</b>。木質部負責由下往上運輸水分，紅色溶液跟著水分流動，所以木質部被染紅。'],
      ['比較甲、乙兩個量筒最終的刻度，芹菜的蒸散作用與哪一個構造最相關？','甲（有葉片）液面下降較多，乙（摘除葉片）下降較少，表示蒸散作用與<b>葉片上的氣孔</b>最相關。']
    ],
    concl:'<h3>重點整理：實驗篇</h3><div class="ops" style="margin-top:0"><button class="btn ghost" data-rv-all="show" data-rv-scope=".concl">👀 全部顯示</button><button class="btn ghost" data-rv-all="hide" data-rv-scope=".concl">🙈 全部隱藏</button></div><p style="color:var(--c-muted);margin-top:0">先想一想，再點<span style="background:#FFF8E1;outline:2px dashed #FFB300;border-radius:6px;padding:0 6px">黃色格子</span>看答案。</p>' +
      '<p>① 維管束是植物的運輸構造，內側的<span class="rv"><b>木質部</b></span>負責由下而上運輸水分。水是透明的不易觀察，所以用染色的溶液代替清水，就能在葉柄橫切面看到染紅的<span class="rv">木質部</span>。</p>' +
      '<table class="datatable"><tr><th>實驗裝置</th><th>操作變因</th><th>應變變因</th><th>實驗結果</th></tr><tr><td>甲（對照組）</td><td class="rv">不摘除葉片（氣孔數不變）</td><td class="rv" rowspan="2">量筒液面下降刻度</td><td class="rv">水位下降較多，水分蒸散較多</td></tr><tr><td>乙（實驗組）</td><td class="rv">摘除葉片（氣孔數減少）</td><td class="rv">水位下降較少，水分蒸散較少</td></tr></table>' +
      '<p>② 結論：在相同的環境條件下，<span class="rv"><b>氣孔數愈多，水分蒸散速率愈快</b></span>。溫度、溼度、空氣流通程度與氣孔數量都會影響蒸散作用的速率。</p>' },
  '32': { unit:'unit-32', title:'實驗 3-2 探測心音和脈搏',
    purpose:'探測<b>心音</b>和<b>脈搏</b>，並觀察<b>運動</b>對心音與脈搏的影響。',
    mats:[['⏱️','計時器 ×1'],['🩺','聽診器 ×1']],
    ops:[['原理動畫','sim32p'],['測量心搏與脈搏','sim32a']],
    qa:[
      ['用聽診器聽到自己的心音，「撲、通」兩聲算是幾次心搏？','<b>1 次</b>。心臟跳動一次會產生兩個心音：心室收縮時房室間瓣膜關閉（撲），心室舒張時心室與動脈間瓣膜關閉（通）。'],
      ['同一個人在同一分鐘內的心搏和脈搏次數是否相同？','<b>相同</b>。脈搏是動脈隨著心臟收縮、舒張而擴張、恢復產生的搏動，所以脈搏來自心搏。'],
      ['運動可以使心搏和脈搏次數發生什麼改變？有什麼意義？','運動後心搏和脈搏次數<b>增加</b>，血液流動加快，能更快把<b>氧氣和養分</b>送給活動中的細胞，並帶走二氧化碳等廢物。']
    ],
    concl:'<h3>重點整理：實驗篇</h3><div class="ops" style="margin-top:0"><button class="btn ghost" data-rv-all="show" data-rv-scope=".concl">👀 全部顯示</button><button class="btn ghost" data-rv-all="hide" data-rv-scope=".concl">🙈 全部隱藏</button></div><p style="color:var(--c-muted);margin-top:0">先想一想，再點<span style="background:#FFF8E1;outline:2px dashed #FFB300;border-radius:6px;padding:0 6px">黃色格子</span>看答案。</p>' +
      '<table class="datatable"><tr><th colspan="2">運動前（次／分鐘）</th><th colspan="2">運動後（次／分鐘）</th></tr><tr><th>心搏</th><th>脈搏</th><th>心搏</th><th>脈搏</th></tr><tr><td>A</td><td>B</td><td>C</td><td>D</td></tr></table>' +
      '<p>心臟收縮舒張時，動脈隨著擴張與恢復，也就是說<span class="rv"><b>脈搏來自於心搏</b></span>，所以同一段時間內同一個人的心搏與脈搏次數相等：<span class="rv"><b>A＝B，C＝D</b></span>。</p><p>運動可以使心搏<span class="rv">加速</span>，所以 <span class="rv"><b>(A＝B)＜(C＝D)</b></span>。</p>' },
  '33': { unit:'unit-33', title:'實驗 3-3 血液流動的觀察',
    purpose:'魚類的尾鰭扁平且透光，可以用顯微鏡觀察<b>活體動物的血液流動</b>。除了觀察血球，也能根據<b>血流的方向</b>判斷動脈、微血管與靜脈。<br><span style="font-size:.95rem;color:var(--c-muted)">本模擬完全以虛擬畫面取代活體小魚，同學不會接觸真實小魚。</span>',
    mats:[['🐟','小魚 ×1'],['🥅','小撈網 ×1'],['🧫','培養皿 ×1'],['☁️','化妝棉 ×3'],['🔬','複式顯微鏡 ×1']],
    ops:[['操作與觀察','sim33a']],
    qa:[
      ['顯微鏡下觀察到移動的橘紅色顆粒應該是什麼？','<b>紅血球</b>。'],
      ['不同粗細血管中，血流速率是否有差異？最細的血管內血流較快還是較慢？','有差異。最細的血管是<b>微血管</b>，血流速率<b>最慢</b>，紅血球幾乎排成單列通過。'],
      ['用沾溼的不織布化妝棉覆蓋住小魚的頭部，有什麼功能？','<b>保濕</b>：讓小魚的頭部與鰓保持溼潤；<b>維持魚體呼吸</b>：鰓溼潤才能繼續進行呼吸，小魚離開水的這段時間才不會缺氧。']
    ],
    concl:'<h3>重點整理：實驗篇</h3><div class="ops" style="margin-top:0"><button class="btn ghost" data-rv-all="show" data-rv-scope=".concl">👀 全部顯示</button><button class="btn ghost" data-rv-all="hide" data-rv-scope=".concl">🙈 全部隱藏</button></div><p style="color:var(--c-muted);margin-top:0">先想一想，再點<span style="background:#FFF8E1;outline:2px dashed #FFB300;border-radius:6px;padding:0 6px">黃色格子</span>看答案。</p>' +
      '<p>① 觀察小魚尾鰭血流時，可以看到許多移動的<span class="rv"><b>紅血球</b></span>。能夠<b>分支成微血管</b>的是<span class="rv"><b>小動脈</b></span>，由<b>微血管匯流而成</b>的是<span class="rv"><b>小靜脈</b></span>。</p>' +
      '<p>② 動脈將血液帶離心臟，靜脈將血液帶回心臟。複式顯微鏡的影像<span class="rv"><b>上下顛倒、左右相反</b></span>，所以視野下往左流的動脈，實際流向是<span class="rv"><b>向右</b></span>。</p>' }
};
var STEPS = ['① 目的','② 器材','③ 操作','④ 問題與討論','⑤ 結論'];
window.LAB_SIMS = window.LAB_SIMS || {};
</script>
<script src="js/lab31.js"></script>

<script>
(function(){
  'use strict';
  var root = document.getElementById('labRoot'), built = {}, cur = '31';
  function build(e){
    var L = LAB[e], wrap = document.createElement('section');
    wrap.className = 'expwrap'; wrap.setAttribute('data-e', e);
    var mats = L.mats.map(function(m,i){ return '<label><input type="checkbox" data-m="'+i+'"><span class="em">'+m[0]+'</span>'+m[1]+'</label>'; }).join('');
    var opTabs = L.ops.length > 1 ? '<div class="seg subtabs">' + L.ops.map(function(o,i){ return '<button data-op="'+i+'" data-v="'+i+'" aria-pressed="'+(i===0)+'">'+o[0]+'</button>'; }).join('') + '</div>' : '';
    var opBodies = L.ops.map(function(o,i){ return '<div class="opbody" data-op="'+i+'" style="'+(i?'display:none':'')+'"></div>'; }).join('');
    var qa = L.qa.map(function(q,i){ return '<div class="q"><b>Q'+(i+1)+'. '+q[0]+'</b><div><button class="btn ghost" style="margin-top:8px;min-height:40px;padding:4px 14px">💭 想好了，看參考答案</button></div><div class="a">'+q[1]+'</div></div>'; }).join('');
    wrap.innerHTML =
      '<h2 style="margin-top:0">'+L.title+'</h2>' +
      '<div class="stepper">' + STEPS.map(function(s,i){ return '<button data-s="'+i+'">'+s+'</button>'; }).join('') + '</div>' +
      '<div class="panel" data-p="0"><div class="card purpose"><h3>🎯 目的</h3><p>'+L.purpose+'</p></div></div>' +
      '<div class="panel" data-p="1"><div class="card"><h3>🧰 器材（以組為單位）</h3><p style="color:var(--c-muted)">把每一樣器材都勾起來，確認準備好了才能開始操作。</p><div class="mat">'+mats+'</div><div style="margin-top:12px"><button class="btn ghost" data-allmat>全部勾選</button></div></div></div>' +
      '<div class="panel" data-p="2">'+opTabs+opBodies+'</div>' +
      '<div class="panel" data-p="3"><div class="qa">'+qa+'</div></div>' +
      '<div class="panel" data-p="4"><div class="concl">'+L.concl+'</div><div style="margin-top:14px;display:flex;gap:10px;flex-wrap:wrap"><a class="btn" href="quiz.html">✏️ 去做練習題</a><button class="btn ghost" data-restart>↺ 重做這個實驗</button></div></div>' +
      '<div class="navrow"><button class="btn ghost" data-prev>◀ 上一步</button><button class="btn" data-next>下一步 ▶</button></div>';
    root.appendChild(wrap);
    UNIT.initReveal(wrap);
    var st = { step:0, visited:{0:true}, opInit:{} };
    function matsOk(){ return Array.prototype.every.call(wrap.querySelectorAll('.mat input'), function(i){ return i.checked; }); }
    function initOp(i){
      if(st.opInit[i]) return; st.opInit[i] = true;
      var fn = window.LAB_SIMS[L.ops[i][1]];
      var box = wrap.querySelector('.opbody[data-op="'+i+'"]');
      if(fn) fn(box); else box.innerHTML = '<p>（模擬載入失敗）</p>';
    }
    function go(s){
      if(s >= 2 && !matsOk()){ CH3.toast('請先把器材全部勾選完成'); s = 1; }
      st.step = s; st.visited[s] = true;
      wrap.querySelectorAll('.panel').forEach(function(p){ p.classList.toggle('on', Number(p.getAttribute('data-p')) === s); });
      wrap.querySelectorAll('.stepper button').forEach(function(b){
        var k = Number(b.getAttribute('data-s'));
        b.setAttribute('aria-current', k === s); b.classList.toggle('visited', !!st.visited[k]);
      });
      if(s === 2) initOp(currentOp());
      wrap.querySelector('[data-prev]').style.visibility = s === 0 ? 'hidden' : '';
      var nx = wrap.querySelector('[data-next]');
      nx.style.visibility = s === 4 ? 'hidden' : '';
      nx.textContent = s === 1 ? '開始操作 ▶' : '下一步 ▶';
      nx.disabled = s === 1 && !matsOk();
      if(s === 4){
        var done = CH3.store.get('labDone', {}); done[e] = true; CH3.store.set('labDone', done); paintDone();
      }
      window.scrollTo({ top: wrap.offsetTop - 80, behavior: UNIT.reduced() ? 'auto' : 'smooth' });
    }
    function currentOp(){ var b = wrap.querySelector('.subtabs [aria-pressed="true"]'); return b ? Number(b.getAttribute('data-op')) : 0; }
    wrap.querySelector('.stepper').addEventListener('click', function(ev){ var b = ev.target.closest('button'); if(b) go(Number(b.getAttribute('data-s'))); });
    wrap.querySelector('[data-prev]').addEventListener('click', function(){ go(Math.max(0, st.step - 1)); });
    wrap.querySelector('[data-next]').addEventListener('click', function(){ go(Math.min(4, st.step + 1)); });
    wrap.querySelectorAll('.mat input').forEach(function(i){ i.addEventListener('change', function(){ i.parentNode.classList.toggle('chk', i.checked); wrap.querySelector('[data-next]').disabled = !matsOk(); }); });
    wrap.querySelector('[data-allmat]').addEventListener('click', function(){ wrap.querySelectorAll('.mat input').forEach(function(i){ i.checked = true; i.parentNode.classList.add('chk'); }); wrap.querySelector('[data-next]').disabled = false; });
    var sub = wrap.querySelector('.subtabs');
    if(sub) UNIT.seg(sub, function(v){
      wrap.querySelectorAll('.opbody').forEach(function(b){ b.style.display = b.getAttribute('data-op') === v ? '' : 'none'; });
      initOp(Number(v));
    });
    wrap.querySelectorAll('.qa .q button').forEach(function(b){ b.addEventListener('click', function(){ b.closest('.q').classList.toggle('open'); b.textContent = b.closest('.q').classList.contains('open') ? '收起答案' : '💭 想好了，看參考答案'; }); });
    wrap.querySelector('[data-restart]').addEventListener('click', function(){ wrap.remove(); delete built[e]; show(e); });
    built[e] = { el:wrap, go:go };
    go(0);
  }
  function show(e){
    cur = e;
    document.body.className = LAB[e].unit;
    document.querySelectorAll('.lab-tab').forEach(function(t){ t.setAttribute('aria-pressed', t.getAttribute('data-e') === e); });
    if(!built[e]) build(e);
    Object.keys(built).forEach(function(k){ built[k].el.style.display = k === e ? '' : 'none'; });
  }
  function paintDone(){ var d = CH3.store.get('labDone', {}); document.querySelectorAll('.lab-tab').forEach(function(t){ t.classList.toggle('done', !!d[t.getAttribute('data-e')]); }); }
  document.getElementById('labTabs').addEventListener('click', function(ev){ var t = ev.target.closest('.lab-tab'); if(t) show(t.getAttribute('data-e')); });
  var m = location.hash.match(/exp(3[123])/);
  paintDone(); show(m ? m[1] : '31');
})();

/* ===== 共用：拖曳或點選放置工具 =====
   makeDrop(toolEl, emoji, svgEl, test(x,y) -> 'ok' | 訊息字串 | null, onOk)
   x,y 為 SVG viewBox 座標；也可「先點工具、再點圖」完成放置 */
window.makeDrop = function(tool, emoji, svg, test, onOk){
  var ghost = null, dragging = false, selected = false;
  function toSvg(cx, cy){ var r = svg.getBoundingClientRect(), vb = svg.viewBox.baseVal; return { x:(cx - r.left) / r.width * vb.width, y:(cy - r.top) / r.height * vb.height, inside: cx >= r.left && cx <= r.right && cy >= r.top && cy <= r.bottom }; }
  function attempt(cx, cy){
    var p = toSvg(cx, cy); if(!p.inside) return false;
    var res = test(p.x, p.y);
    if(res === 'ok'){ tool.classList.add('placed'); tool.classList.remove('sel'); selected = false; onOk(p.x, p.y); return true; }
    if(res) CH3.toast(res); return false;
  }
  tool.addEventListener('pointerdown', function(e){
    if(tool.classList.contains('placed')) return;
    dragging = false; var sx = e.clientX, sy = e.clientY;
    function move(ev){
      if(!dragging && Math.hypot(ev.clientX - sx, ev.clientY - sy) > 8){ dragging = true; ghost = document.createElement('div'); ghost.className = 'drag-ghost'; ghost.textContent = emoji; document.body.appendChild(ghost); }
      if(dragging){ ghost.style.left = ev.clientX + 'px'; ghost.style.top = ev.clientY + 'px'; ev.preventDefault(); }
    }
    function up(ev){
      document.removeEventListener('pointermove', move); document.removeEventListener('pointerup', up);
      if(dragging){ ghost.remove(); ghost = null; attempt(ev.clientX, ev.clientY); }
      else { selected = !selected; tool.classList.toggle('sel', selected); if(selected) CH3.toast('好，現在點圖上要放的位置'); }
    }
    document.addEventListener('pointermove', move, { passive:false }); document.addEventListener('pointerup', up);
  });
  svg.addEventListener('click', function(e){ if(selected && !tool.classList.contains('placed')) attempt(e.clientX, e.clientY); });
  return { reset:function(){ tool.classList.remove('placed','sel'); selected = false; } };
};
</script>
