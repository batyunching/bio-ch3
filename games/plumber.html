<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>植物水管工｜第3章 遊戲</title>
<link rel="stylesheet" href="../css/style.css">
<script src="https://batyunching.github.io/bio/js/account.js" data-chapter="ch3" data-prefix="ch3."></script>
<style>
  .inv{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .inv .stat.b{ color:#0277BD; } .inv .stat.o{ color:#E65100; }
  .req{ display:flex; gap:8px; flex-wrap:wrap; margin:8px 0; }
  .req span{ padding:4px 12px; border-radius:999px; background:#F1F0EA; font-weight:700; font-size:.88rem; }
  .req span.ok{ background:#E8F5E9; color:var(--c-ok); }
  #board .cell{ cursor:pointer; }
  #board .cell:hover .hl{ opacity:.12; }
  .play-layout{ display:grid; grid-template-columns:1.6fr 1fr; gap:16px; align-items:start; }
  @media (max-width:900px){ .play-layout{ grid-template-columns:1fr; } }
</style>
</head>
<body data-page="games" data-root="../" data-game class="unit-31">
<main class="wrap">
  <div class="page-hero">
    <h1>🔧 植物水管工</h1>
    <p>把藍色的<b>木質部管</b>從根接到葉、把橘色的<b>韌皮部管</b>接到需要養分的地方，打開氣孔讓水被蒸散拉力拉上去！</p>
  </div>

  <div id="select">
    <h2>選擇關卡</h2>
    <div class="lvl-grid" id="lvls"></div>
    <p style="margin-top:16px"><button class="btn ghost" data-lobby>🎮 回到遊戲大廳</button> <button class="btn ghost" id="howBtn">❔ 玩法說明</button></p>
  </div>

  <div id="play" style="display:none">
    <div class="game-top">
      <button class="btn ghost" data-lobby>🎮 遊戲大廳</button><button class="btn ghost" id="back">☰ 選關</button>
      <strong id="lvlName" style="font-size:1.15rem"></strong>
      <span class="stat">🔄 步數 <span id="moves">0</span></span>
      <span class="stat">✅ 答對 <span id="acc">0/0</span></span>
      <span class="stat" id="timerBox" style="display:none">⏱ <span id="timer">90</span> 秒</span>
    </div>
    <div class="play-layout">
      <div class="game-stage"><svg id="board" viewBox="0 0 540 420" role="img" aria-label="植物水管工遊戲盤面"></svg></div>
      <div class="card">
        <h3 style="margin-top:0">任務</h3>
        <div id="lvlNote" style="font-size:.95rem"></div>
        <div class="req" id="req"></div>
        <h3>管子庫存</h3>
        <div class="inv">
          <span class="stat b">▲ 藍管 × <span id="invB">0</span></span>
          <span class="stat o">● 橘管 × <span id="invO">0</span></span>
        </div>
        <div class="ops" style="margin-top:10px">
          <button class="btn" style="background:#0288D1" id="askB">❓ 答題拿藍管</button>
          <button class="btn" style="background:#EF6C00" id="askO">❓ 答題拿橘管</button>
        </div>
        <div id="extra"></div>
        <p style="font-size:.85rem;color:var(--c-muted);margin-bottom:0">點管子可以旋轉 90°；點虛線格子放入庫存的管子。答錯時，松鼠會啃掉一節韌皮部管！</p>
      </div>
    </div>
  </div>
</main>

<script src="../js/common.js"></script>
<script src="../js/unit.js"></script>
<script src="../data/questions.js"></script>
<script src="../js/game-common.js"></script>
<script>
(function(){
  'use strict';
  var COLS = 8, ROWS = 6, CS = 64, OX = 14, OY = 18;
  var N = 1, E = 2, S = 4, W = 8;
  var DIRS = [[N,-1,0],[E,0,1],[S,1,0],[W,0,-1]];
  var OPP = {1:4, 2:8, 4:1, 8:2};
  var BLUE = '#29B6F6', ORANGE = '#FF9800';
  function rot(m){ return ((m << 1) | (m >> 3)) & 15; }
  var TERM = {
    root:  { ic:'💧', t:'根毛' }, leafW:{ ic:'🍃', t:'葉・氣孔' }, leafF:{ ic:'☀️', t:'葉・光合作用' },
    store: { ic:'🥔', t:'根部儲存' }, bud:{ ic:'🌸', t:'花芽' }
  };
  var LEVELS = [
    { name:'① 玉米', sub:'散生排列・沒有形成層', par:12,
      note:'玉米的維管束<b>散生排列、沒有形成層</b>。把<b>水</b>從根毛送到葉片，再把葉片光合作用做出的<b>養分</b>送到根部儲存。',
      blue:{ path:[[5,1],[4,1],[3,1],[2,1],[1,1],[1,2],[0,2]], from:'root', to:'leafW' },
      orange:{ path:[[0,5],[1,5],[2,5],[3,5],[3,6],[4,6],[5,6]], from:'leafF', to:'store' }, gaps:[1,1] },
    { name:'② 向日葵', sub:'環狀排列・有形成層', par:16,
      note:'向日葵的維管束<b>環狀排列</b>，木質部在內、韌皮部在外。管線轉彎變多了！',
      blue:{ path:[[5,0],[4,0],[4,1],[3,1],[2,1],[2,2],[1,2],[0,2]], from:'root', to:'leafW' },
      orange:{ path:[[0,6],[1,6],[1,5],[2,5],[3,5],[3,4],[4,4],[5,4]], from:'leafF', to:'store' }, gaps:[2,2] },
    { name:'③ 榕樹', sub:'多年生・形成層發達', par:16, thick:2,
      note:'榕樹是多年生植物，<b>形成層發達</b>，莖可以逐年加粗。接通後，還要讓形成層「加粗」主幹 2 次，提高流量！',
      blue:{ path:[[5,2],[4,2],[3,2],[3,1],[2,1],[1,1],[0,1]], from:'root', to:'leafW' },
      orange:{ path:[[0,5],[1,5],[1,4],[2,4],[3,4],[4,4],[4,5],[5,5]], from:'leafF', to:'store' }, gaps:[2,2] },
    { name:'④ 早春櫻花', sub:'還沒長葉就開花', par:12,
      note:'冬季過後，櫻花<b>葉片還沒長出</b>。要把<b>根部儲存的養分</b>經韌皮部往<b>上</b>送到花芽，早春才能開花！（沒有葉片，不需要接水管）',
      orange:{ path:[[5,3],[4,3],[3,3],[3,4],[2,4],[1,4],[1,3],[0,3]], from:'store', to:'bud' }, gaps:[0,3] },
    { name:'⑤ 柳杉保衛戰', sub:'限時 90 秒・松鼠來襲', par:16, timer:90,
      note:'松鼠最愛啃柳杉的樹皮！每隔一段時間就會啃掉一節<b>韌皮部管</b>。在 90 秒內把水和養分都接通！',
      blue:{ path:[[5,1],[4,1],[3,1],[2,1],[2,2],[1,2],[0,2]], from:'root', to:'leafW' },
      orange:{ path:[[0,6],[1,6],[2,6],[2,5],[3,5],[4,5],[4,6],[5,6]], from:'leafF', to:'store' }, gaps:[2,2] }
  ];
  var board = document.getElementById('board');
  var L, grid, st;
  function $(id){ return document.getElementById(id); }

  /* ---------- 選關 ---------- */
  function stars(){ return CH3.store.get('plumberStars', [0,0,0,0,0]); }
  function showSelect(){
    clearTimers();
    $('select').style.display = ''; $('play').style.display = 'none';
    var sv = stars();
    $('lvls').innerHTML = LEVELS.map(function(l, i){
      var open = i === 0 || sv[i-1] > 0;
      return '<button class="lvl" data-l="'+i+'" '+(open?'':'disabled')+'><b>'+l.name+'</b><small>'+l.sub+'</small><div class="st">'+('★★★'.slice(0, sv[i]) + '<span style="color:#ddd">'+'★★★'.slice(sv[i])+'</span>')+'</div>'+(open?'':'🔒 先過上一關')+'</button>';
    }).join('');
  }
  $('lvls').addEventListener('click', function(e){ var b = e.target.closest('[data-l]'); if(b && !b.disabled) start(Number(b.getAttribute('data-l'))); });
  $('back').addEventListener('click', showSelect);

  /* ---------- 建立關卡 ---------- */
  function dirBetween(a, b){ for(var i=0;i<4;i++){ if(a[0]+DIRS[i][1] === b[0] && a[1]+DIRS[i][2] === b[1]) return DIRS[i][0]; } return 0; }
  function buildNet(color, net, gapN){
    var p = net.path, interior = [];
    p.forEach(function(rc, i){
      var m = 0;
      if(i > 0) m |= dirBetween(rc, p[i-1]);
      if(i < p.length - 1) m |= dirBetween(rc, p[i+1]);
      var cell = { r:rc[0], c:rc[1], color:color, need:m, net:true };
      if(i === 0 || i === p.length - 1){ cell.kind = 'term'; cell.mask = m; cell.term = i === 0 ? net.from : net.to; cell.role = i === 0 ? 'src' : 'dst'; }
      else { cell.kind = 'pipe'; cell.mask = scramble(m); interior.push(cell); }
      grid[rc[0]][rc[1]] = cell;
    });
    CH3.shuffle(interior).slice(0, gapN).forEach(function(c){ c.kind = 'gap'; c.mask = 0; });
  }
  function scramble(m){ var r = m, k = 1 + Math.floor(Math.random() * 3); for(var i=0;i<k;i++) r = rot(r); if(r === m) r = rot(r); return r; }
  function start(i){
    L = LEVELS[i]; st = { i:i, moves:0, right:0, total:0, inv:{blue:0, orange:0}, thick:0, won:false, timeLeft:L.timer || 0 };
    grid = []; for(var r=0;r<ROWS;r++){ grid.push([]); for(var c=0;c<COLS;c++) grid[r].push(null); }
    if(L.blue) buildNet('blue', L.blue, L.gaps[0]);
    buildNet('orange', L.orange, L.gaps[1]);
    // 干擾管
    var shapes = [5, 10, 3, 6, 12, 9, 7, 11];
    for(var r2=0;r2<ROWS;r2++) for(var c2=0;c2<COLS;c2++){
      if(!grid[r2][c2] && Math.random() < .32) grid[r2][c2] = { r:r2, c:c2, kind:'pipe', color: L.blue && Math.random() < .5 ? 'blue' : 'orange', mask: shapes[Math.floor(Math.random()*shapes.length)], decoy:true };
    }
    $('select').style.display = 'none'; $('play').style.display = '';
    $('lvlName').textContent = L.name + '：' + L.sub;
    $('lvlNote').innerHTML = L.note;
    $('askB').style.display = L.blue ? '' : 'none';
    $('timerBox').style.display = L.timer ? '' : 'none';
    clearTimers();
    if(L.timer){ $('timer').textContent = L.timer; st.tm = setInterval(tickTimer, 1000); st.sq = setInterval(function(){ squirrel('🐿️ 松鼠又來啃樹皮了！'); }, 15000); }
    draw(); window.scrollTo(0, 0);
  }
  function clearTimers(){ if(st){ clearInterval(st.tm); clearInterval(st.sq); clearInterval(st.anim); } }
  function tickTimer(){
    if(st.won) return;
    st.timeLeft--; $('timer').textContent = st.timeLeft;
    if(st.timeLeft <= 0){ clearTimers(); lose(); }
  }

  /* ---------- 連通判斷 ---------- */
  function flow(color){
    var src = null, dst = null, seen = {};
    grid.forEach(function(row){ row.forEach(function(c){ if(c && c.kind === 'term' && c.color === color){ if(c.role === 'src') src = c; else dst = c; } }); });
    if(!src) return { ok:true, seen:{} };
    var q = [src]; seen[src.r+','+src.c] = true;
    while(q.length){
      var cur = q.shift();
      DIRS.forEach(function(d){
        if(!(cur.mask & d[0])) return;
        var nr = cur.r + d[1], nc = cur.c + d[2];
        if(nr < 0 || nc < 0 || nr >= ROWS || nc >= COLS) return;
        var n = grid[nr][nc];
        if(!n || n.kind === 'gap' || n.color !== color || !(n.mask & OPP[d[0]])) return;
        var k = nr+','+nc; if(seen[k]) return; seen[k] = true; q.push(n);
      });
    }
    return { ok: !!seen[dst.r+','+dst.c], seen:seen };
  }

  /* ---------- 繪圖 ---------- */
  function pipeSvg(cell, lit, w){
    var x = OX + cell.c * CS + CS/2, y = OY + cell.r * CS + CS/2, col = cell.color === 'blue' ? BLUE : ORANGE, h = '';
    w = w || 14;
    DIRS.forEach(function(d){
      if(!(cell.mask & d[0])) return;
      var ex = x + d[2] * CS/2, ey = y + d[1] * CS/2;
      h += '<line x1="'+x+'" y1="'+y+'" x2="'+ex+'" y2="'+ey+'" stroke="'+col+'" stroke-width="'+w+'" stroke-linecap="round" opacity="'+(lit ? 1 : .5)+'"/>';
      if(lit) h += '<line x1="'+x+'" y1="'+y+'" x2="'+ex+'" y2="'+ey+'" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".55"/>';
    });
    h += cell.color === 'blue' ? '<polygon points="'+x+','+(y-6)+' '+(x+5)+','+(y+4)+' '+(x-5)+','+(y+4)+'" fill="'+(lit?'#01579B':'#fff')+'"/>' : '<circle cx="'+x+'" cy="'+y+'" r="4.5" fill="'+(lit?'#BF360C':'#fff')+'"/>';
    return h;
  }
  function draw(){
    var fb = L.blue ? flow('blue') : { ok:true, seen:{} }, fo = flow('orange');
    var h = '<rect width="540" height="420" fill="#FBFBF7"/>';
    h += '<rect x="'+OX+'" y="'+OY+'" width="'+(COLS*CS)+'" height="'+(2*CS)+'" fill="#E3F2FD"/>';
    h += '<rect x="'+OX+'" y="'+(OY+2*CS)+'" width="'+(COLS*CS)+'" height="'+(2*CS)+'" fill="#F1F8E9"/>';
    h += '<rect x="'+OX+'" y="'+(OY+4*CS)+'" width="'+(COLS*CS)+'" height="'+(2*CS)+'" fill="#EFEBE9"/>';
    h += '<g font-size="12" font-weight="700" fill="#90A4AE"><text x="'+(OX+COLS*CS+4)+'" y="'+(OY+30)+'" writing-mode="tb">葉</text><text x="'+(OX+COLS*CS+4)+'" y="'+(OY+2*CS+30)+'" writing-mode="tb">莖</text><text x="'+(OX+COLS*CS+4)+'" y="'+(OY+4*CS+30)+'" writing-mode="tb">根</text></g>';
    for(var r=0;r<=ROWS;r++) h += '<line x1="'+OX+'" y1="'+(OY+r*CS)+'" x2="'+(OX+COLS*CS)+'" y2="'+(OY+r*CS)+'" stroke="#E0E0E0"/>';
    for(var c=0;c<=COLS;c++) h += '<line x1="'+(OX+c*CS)+'" y1="'+OY+'" x2="'+(OX+c*CS)+'" y2="'+(OY+ROWS*CS)+'" stroke="#E0E0E0"/>';
    grid.forEach(function(row){ row.forEach(function(cell){
      if(!cell) return;
      var x = OX + cell.c * CS, y = OY + cell.r * CS, lit = (cell.color === 'blue' ? fb : fo).seen[cell.r+','+cell.c];
      h += '<g class="cell" data-r="'+cell.r+'" data-c="'+cell.c+'"><rect class="hl" x="'+x+'" y="'+y+'" width="'+CS+'" height="'+CS+'" fill="#000" opacity="0"/>';
      if(cell.kind === 'gap'){
        var col = cell.color === 'blue' ? BLUE : ORANGE;
        h += '<rect x="'+(x+6)+'" y="'+(y+6)+'" width="'+(CS-12)+'" height="'+(CS-12)+'" rx="10" fill="#fff" stroke="'+col+'" stroke-width="3" stroke-dasharray="6 4"/><text x="'+(x+CS/2)+'" y="'+(y+CS/2+8)+'" text-anchor="middle" font-size="24" font-weight="900" fill="'+col+'">＋</text>';
      } else if(cell.kind === 'term'){
        var thick = L.thick && cell.color === 'blue' ? 14 + st.thick * 5 : 14;
        h += pipeSvg(cell, lit, thick);
        h += '<circle cx="'+(x+CS/2)+'" cy="'+(y+CS/2)+'" r="22" fill="#fff" stroke="'+(cell.color === 'blue' ? BLUE : ORANGE)+'" stroke-width="3"/><text x="'+(x+CS/2)+'" y="'+(y+CS/2+8)+'" text-anchor="middle" font-size="22">'+TERM[cell.term].ic+'</text>';
        h += '<text x="'+(x+CS/2)+'" y="'+(y + (cell.r === 0 ? CS - 1 : 11))+'" text-anchor="middle" font-size="10" font-weight="900" fill="#37474F">'+TERM[cell.term].t+'</text>';
      } else {
        h += pipeSvg(cell, lit, L.thick && cell.color === 'blue' && cell.net ? 14 + st.thick * 5 : 14);
      }
      h += '</g>';
    }); });
    h += '<g id="fx"></g>';
    board.innerHTML = h;
    // 狀態
    var req = '';
    if(L.blue) req += '<span class="'+(fb.ok?'ok':'')+'">'+(fb.ok?'✅':'⬜')+' 水：根毛 → 葉片</span>';
    req += '<span class="'+(fo.ok?'ok':'')+'">'+(fo.ok?'✅':'⬜')+' 養分：'+TERM[L.orange.from].t+' → '+TERM[L.orange.to].t+'</span>';
    if(L.thick) req += '<span class="'+(st.thick >= L.thick?'ok':'')+'">'+(st.thick >= L.thick?'✅':'⬜')+' 形成層加粗 '+st.thick+'/'+L.thick+'</span>';
    $('req').innerHTML = req;
    $('invB').textContent = st.inv.blue; $('invO').textContent = st.inv.orange;
    $('moves').textContent = st.moves; $('acc').textContent = st.right + '/' + st.total;
    var ex = '';
    if(L.thick && fb.ok && fo.ok && st.thick < L.thick && !st.won) ex = '<div class="good">接通了！榕樹的形成層很發達，答對題目讓莖<b>加粗</b>，提高流量。</div><button class="btn plant" id="thickBtn">🌳 形成層加粗（答 1 題）</button>';
    if(!st.won) $('extra').innerHTML = ex;
    var tb = $('thickBtn'); if(tb) tb.addEventListener('click', function(){ GAME.ask({ units:['3-1'], title:'形成層加粗' }).then(function(ok){ count(ok); if(ok){ st.thick++; } else squirrel(); draw(); }); });
    if(fb.ok && fo.ok && (!L.thick || st.thick >= L.thick) && !st.won) win();
  }
  function count(ok){ st.total++; if(ok) st.right++; }

  /* ---------- 操作 ---------- */
  board.addEventListener('click', function(e){
    if(!st || st.won) return;
    var g = e.target.closest('.cell'); if(!g) return;
    var cell = grid[g.getAttribute('data-r')][g.getAttribute('data-c')];
    if(cell.kind === 'pipe'){ cell.mask = rot(cell.mask); st.moves++; UNIT.thump(300, .05, .2); draw(); }
    else if(cell.kind === 'gap'){
      if(st.inv[cell.color] > 0){ st.inv[cell.color]--; cell.kind = 'pipe'; cell.mask = scramble(cell.need); draw(); }
      else CH3.toast('沒有' + (cell.color === 'blue' ? '藍管（木質部）' : '橘管（韌皮部）') + '了，先答題拿管子！');
    } else if(cell.kind === 'term') CH3.toast(TERM[cell.term].t + '：固定不能轉');
  });
  function askFor(color){
    if(st.won) return;
    GAME.ask({ units:['3-1'], title:'答對拿 1 節' + (color === 'blue' ? '藍管 ▲' : '橘管 ●'), ngText:'松鼠跑來了！' }).then(function(ok){
      count(ok);
      if(ok){ st.inv[color]++; draw(); } else squirrel();
    });
  }
  $('askB').addEventListener('click', function(){ askFor('blue'); });
  $('askO').addEventListener('click', function(){ askFor('orange'); });
  function squirrel(title){
    if(st.won) return;
    var cand = []; grid.forEach(function(row){ row.forEach(function(c){ if(c && c.net && c.color === 'orange' && c.kind === 'pipe') cand.push(c); }); });
    if(!cand.length){ draw(); return; }
    var c = cand[Math.floor(Math.random() * cand.length)];
    c.kind = 'gap'; c.mask = 0; draw();
    var fx = board.querySelector('#fx');
    fx.innerHTML = '<text x="'+(OX + c.c*CS + CS/2)+'" y="'+(OY + c.r*CS + CS/2 + 14)+'" text-anchor="middle" font-size="40">🐿️</text>';
    setTimeout(function(){ fx.innerHTML = ''; }, 1400);
    CH3.toast((title || '🐿️ 松鼠啃掉一節韌皮部！') + ' 韌皮部受損 → 根部得不到養分');
  }

  /* ---------- 過關 ---------- */
  function centers(path){ return path.map(function(rc){ return [OX + rc[1]*CS + CS/2, OY + rc[0]*CS + CS/2]; }); }
  function win(){
    st.won = true; clearTimers();
    var nets = []; if(L.blue) nets.push({ pts:centers(L.blue.path), col:'#0277BD', shape:'tri' }); nets.push({ pts:centers(L.orange.path), col:'#E65100' });
    $('extra').innerHTML = '<div class="good">🎉 全部接通了！' + (L.blue ? '打開氣孔，讓<b>蒸散作用</b>把水往上拉！' : '養分往上送到花芽，櫻花要開了！') + '</div><button class="btn plant" id="openBtn">' + (L.blue ? '🍃 打開氣孔' : '🌸 送出養分') + '</button>';
    $('openBtn').addEventListener('click', function(){
      this.disabled = true;
      var t0 = performance.now(), fx = board.querySelector('#fx');
      function frame(now){
        var k = (now - t0) / 2600, h = '';
        nets.forEach(function(n){
          for(var j=0;j<6;j++){
            var u = ((k * 1.5 + j / 6) % 1) * (n.pts.length - 1), i = Math.floor(u), f = u - i;
            var a = n.pts[i], b = n.pts[Math.min(i+1, n.pts.length-1)], x = a[0] + (b[0]-a[0])*f, y = a[1] + (b[1]-a[1])*f;
            h += n.shape === 'tri' ? '<polygon points="'+x+','+(y-7)+' '+(x+6)+','+(y+5)+' '+(x-6)+','+(y+5)+'" fill="'+n.col+'"/>' : '<circle cx="'+x+'" cy="'+y+'" r="6" fill="'+n.col+'"/>';
          }
        });
        if(L.blue){ var top = centers([L.blue.path[L.blue.path.length-1]])[0]; h += '<text x="'+(top[0]+18)+'" y="'+(top[1]-16 - (k*30)%30)+'" font-size="20" fill="#4FC3F7" font-weight="900">~ ~</text>'; }
        fx.innerHTML = h;
        if(k < 1) requestAnimationFrame(frame); else result();
      }
      requestAnimationFrame(frame);
    });
  }
  function result(){
    var acc = st.total ? st.right / st.total : 1;
    var s = 1 + (st.moves <= L.par ? 1 : 0) + (acc >= .8 ? 1 : 0);
    var sv = stars(); sv[st.i] = Math.max(sv[st.i], s); CH3.store.set('plumberStars', sv);
    var allDone = sv.every(function(x){ return x > 0; });
    var m = GAME.modal('<h2 style="text-align:center">'+L.name+' 過關！</h2><div class="stars">'+'★★★'.slice(0,s)+'<span style="color:#ddd">'+'★★★'.slice(s)+'</span></div>' +
      '<p style="text-align:center">步數 '+st.moves+'（目標 ≤ '+L.par+'）・答對率 '+Math.round(acc*100)+'%</p>' +
      '<p style="background:var(--u-l);padding:10px 14px;border-radius:12px">'+({0:'水由<b>木質部</b>從下往上運，養分由<b>韌皮部</b>運送。',1:'環狀排列：木質部在內、韌皮部在外，中間有<b>形成層</b>。',2:'形成層向內產生木質部、向外產生韌皮部，所以莖可以<b>加粗</b>。',3:'葉片還沒長出時，根部儲存的養分經韌皮部<b>往上</b>運到花芽。',4:'樹皮被環狀啃食 → 韌皮部破壞 → 養分到不了根 → 根死亡無法吸水。'})[st.i]+'</p>' +
      '<div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap"><button class="btn ghost" data-a="again">↺ 再玩一次</button><button class="btn ghost" data-a="sel">選關</button>' + (st.i < 4 ? '<button class="btn plant" data-a="next">下一關 ▶</button>' : '') + '</div>');
    m.el.addEventListener('click', function(e){
      var b = e.target.closest('[data-a]'); if(!b) return; m.close();
      var a = b.getAttribute('data-a'); if(a === 'again') start(st.i); else if(a === 'next') start(st.i + 1); else showSelect();
    });
    if(allDone) GAME.unlock('plumber');
  }
  function lose(){
    st.won = true;
    var m = GAME.modal('<h2 style="text-align:center">⏰ 時間到！</h2><p>柳杉的樹皮被松鼠啃得太嚴重，養分運不到根部……再試一次，答對題目就能拿到更多管子修補！</p><div style="display:flex;gap:10px;justify-content:center"><button class="btn ghost" data-a="sel">選關</button><button class="btn plant" data-a="again">↺ 再挑戰</button></div>');
    m.el.addEventListener('click', function(e){ var b = e.target.closest('[data-a]'); if(!b) return; m.close(); if(b.getAttribute('data-a') === 'again') start(st.i); else showSelect(); });
  }

  var STEPS = ['盤面是植物的剖面：最下面是<b>根毛 💧</b>（水源），最上面是<b>葉片</b>和<b>花芽</b>。',
    '<b>點管子</b>可以旋轉 90°。把藍色 ▲ <b>木質部管</b>從根毛接到葉片（水只能由下往上）。',
    '把橘色 ● <b>韌皮部管</b>從製造養分的地方接到需要養分的地方（養分可上可下）。',
    '虛線格子缺管子：按「答題拿管子」，<b>答對 1 題得 1 節</b>，再點虛線格放進去。',
    '答錯的話，<b>松鼠</b>會跑來啃掉一節韌皮部管！',
    '全部接通後按「打開氣孔」，看水被<b>蒸散作用</b>的拉力拉上去。步數少、答對率高就能拿 3 顆星！'];
  $('howBtn').addEventListener('click', function(){ GAME.intro('plumber', '🔧 植物水管工：玩法', STEPS); });
  /* 測試用：在主控台輸入 PLUMBER_SOLVE() 直接接好（老師示範也可用） */
  window.PLUMBER_SOLVE = function(){ grid.forEach(function(row){ row.forEach(function(c){ if(c && c.net && c.kind !== 'term'){ c.kind = 'pipe'; c.mask = c.need; } }); }); draw(); };
  showSelect();
  GAME.introOnce('plumber', '🔧 植物水管工：玩法', STEPS);
  GAME.inProgress = function(){ return !!(st && !st.won && document.getElementById('play').style.display !== 'none'); };
})();
</script>
</body>
</html>
