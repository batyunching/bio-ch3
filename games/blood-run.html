<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>血液快遞大冒險｜第3章 遊戲</title>
<link rel="stylesheet" href="../css/style.css">
<script src="https://batyunching.github.io/bio/js/account.js" data-chapter="ch3" data-prefix="ch3."></script>
<style>
  .play-layout{ display:grid; grid-template-columns:1.3fr 1fr; gap:16px; align-items:start; }
  @media (max-width:900px){ .play-layout{ grid-template-columns:1fr; } }
  .mission{ display:grid; gap:6px; margin:8px 0; }
  .mission div{ background:#F1F0EA; border-radius:12px; padding:6px 12px; font-weight:700; }
  .mission div.ok{ background:#E8F5E9; color:var(--c-ok); }
  .dice{ font-size:3rem; text-align:center; height:64px; }
  .log{ max-height:180px; overflow:auto; font-size:.88rem; background:#FAFAF5; border-radius:12px; padding:8px 12px; }
  .log p{ margin:3px 0; }
  .cargo{ font-size:1.1rem; font-weight:900; }
</style>
</head>
<body data-page="games" data-root="../" data-game class="unit-32">
<main class="wrap">
  <div class="page-hero">
    <h1>🩸 血液快遞大冒險（個人模式）</h1>
    <p>你是一顆<b>紅血球快遞員</b>：在肺取 O₂ → 送到全身組織 → 帶回 CO₂ → 在肺交付。答題擲骰、走對每一站，5 分鐘內拿到愈多快遞章愈好！</p>
  </div>

  <div class="game-top">
    <button class="btn ghost" data-lobby>🎮 遊戲大廳</button>
    <span class="stat">⏱ <span id="time">5:00</span></span>
    <span class="stat">📮 快遞章 <span id="stamps">0</span></span>
    <span class="stat">✅ 答對 <span id="acc">0/0</span></span>
    <span style="flex:1"></span>
    <button class="btn ghost" id="howBtn">❔ 玩法</button>
    <button class="btn blood" id="startBtn">▶ 開始（5 分鐘）</button>
  </div>

  <div class="play-layout">
    <div class="game-stage"><svg id="bd" viewBox="0 0 580 580" role="img" aria-label="血液循環賽道"></svg></div>
    <div class="card">
      <div class="cargo" id="cargo"></div>
      <div class="mission" id="mission"></div>
      <div class="dice" id="dice">🎲</div>
      <div class="ops" style="justify-content:center"><button class="btn blood" id="rollBtn" disabled>❓ 答題擲骰子</button></div>
      <h3 style="margin-bottom:4px">快遞日誌</h3>
      <div class="log" id="log"><p>按「開始」出發！起點是 ① 左心室。</p></div>
    </div>
  </div>
</main>

<script src="../js/common.js"></script>
<script src="../js/unit.js"></script>
<script src="../data/questions.js"></script>
<script src="../js/game-common.js"></script>
<script>
(function(){
  'use strict';
  var OXY = '#E53935', DEOXY = '#8E1B1B';
  var STN = ['左心室','主動脈','小動脈','組織微血管','小靜脈','大靜脈','右心房','右心室','肺動脈','肺微血管','肺靜脈','左心房'];
  var EV = { 3:'run', 5:'bleed', 7:'lymph', 19:'breath' };
  var EVTXT = { run:['🏃','跑完 800 公尺'], bleed:['🩹','血管破裂'], lymph:['💧','組織液漏出'], breath:['🫁','深呼吸'] };
  var CS = 80, OFF = 10;
  function $(id){ return document.getElementById(id); }
  function isStation(s){ return s % 2 === 0; }
  function stNum(s){ return s / 2 + 1; }
  function oxySq(s){ return s >= 18 || s < 6; }   // 18（肺微血管）之後到 6（組織微血管）之前是充氧血
  function pos(s){
    var p = (s + 9) % 24, r, c;
    if(p <= 6){ r = 0; c = p; } else if(p <= 12){ r = p - 6; c = 6; } else if(p <= 18){ r = 6; c = 18 - p; } else { r = 24 - p; c = 0; }
    return { x: OFF + c * CS + CS/2, y: OFF + r * CS + CS/2 };
  }
  var g = null;
  function newGame(){ return { sq:0, cargo:'O2', dO2:false, dCO2:false, stamps:0, right:0, total:0, time:300, busy:false, over:false, bleedLock:false }; }

  /* ---------- 畫盤面 ---------- */
  function draw(){
    var h = '<rect width="580" height="580" fill="#FBFBF7"/>';
    // 中央示意
    h += '<g opacity=".95"><path d="M210 120 C170 120 160 175 190 185 C220 185 260 175 270 150 C270 130 250 120 210 120Z M370 120 C410 120 420 175 390 185 C360 185 320 175 310 150 C310 130 330 120 370 120Z" fill="#F8BBD0" stroke="#EC407A" stroke-width="2"/>';
    h += '<text x="290" y="112" text-anchor="middle" font-size="15" font-weight="900" fill="#AD1457">肺</text>';
    h += '<rect x="215" y="225" width="150" height="110" rx="34" fill="#FFEBEE" stroke="#E57373" stroke-width="2"/><line x1="290" y1="228" x2="290" y2="332" stroke="#E57373" stroke-width="2"/><line x1="218" y1="280" x2="362" y2="280" stroke="#E57373" stroke-dasharray="4 3" stroke-width="2"/>';
    h += '<g font-size="12" font-weight="700" fill="#B71C1C" text-anchor="middle"><text x="252" y="258">右心房</text><text x="328" y="258">左心房</text><text x="252" y="312">右心室</text><text x="328" y="312">左心室</text></g>';
    h += '<rect x="200" y="385" width="180" height="70" rx="18" fill="#FFF3E0" stroke="#FFB74D" stroke-width="2"/><text x="290" y="426" text-anchor="middle" font-size="15" font-weight="900" fill="#E65100">全身組織細胞</text>';
    h += '<text x="290" y="205" text-anchor="middle" font-size="14" font-weight="900" fill="#78909C">↑ 肺循環 ↑</text><text x="290" y="370" text-anchor="middle" font-size="14" font-weight="900" fill="#78909C">↓ 體循環 ↓</text>';
    // 淋巴支線（7 → 10）
    var a = pos(7), b = pos(10);
    h += '<path d="M'+a.x+' '+(a.y-30)+' C'+(a.x-20)+' 420 '+(b.x+60)+' '+(b.y+40)+' '+(b.x+30)+' '+b.y+'" stroke="#66BB6A" stroke-width="5" stroke-dasharray="8 6" fill="none"/>';
    h += '<circle cx="'+(b.x+70)+'" cy="'+(b.y+70)+'" r="13" fill="#A5D6A7" stroke="#2E7D32" stroke-width="2"/><text x="'+(b.x+70)+'" y="'+(b.y+100)+'" text-anchor="middle" font-size="11" font-weight="900" fill="#2E7D32">淋巴結</text></g>';
    // 格子
    for(var s=0;s<24;s++){
      var p = pos(s), ox = oxySq(s), col = ox ? OXY : DEOXY;
      h += '<rect x="'+(p.x-37)+'" y="'+(p.y-37)+'" width="74" height="74" rx="14" fill="'+(isStation(s) ? '#fff' : (ox ? '#FFEBEE' : '#F3E5E5'))+'" stroke="'+col+'" stroke-width="'+(isStation(s)?4:2)+'" '+(ox?'':'stroke-dasharray="7 4"')+'/>';
      if(isStation(s)){
        h += '<circle cx="'+(p.x-24)+'" cy="'+(p.y-24)+'" r="12" fill="'+col+'"/><text x="'+(p.x-24)+'" y="'+(p.y-19)+'" text-anchor="middle" font-size="13" font-weight="900" fill="#fff">'+stNum(s)+'</text>';
        h += '<text x="'+p.x+'" y="'+(p.y+8)+'" text-anchor="middle" font-size="'+(STN[stNum(s)-1].length > 4 ? 11 : 13)+'" font-weight="900" fill="#37474F">'+STN[stNum(s)-1]+'</text>';
        if(s === 6 || s === 18) h += '<text x="'+p.x+'" y="'+(p.y+27)+'" text-anchor="middle" font-size="11" font-weight="700" fill="#1565C0">O₂⇄CO₂</text>';
      } else if(EV[s]){
        h += '<text x="'+p.x+'" y="'+(p.y+2)+'" text-anchor="middle" font-size="24">'+EVTXT[EV[s]][0]+'</text><text x="'+p.x+'" y="'+(p.y+24)+'" text-anchor="middle" font-size="10" font-weight="700" fill="#5D4037">'+EVTXT[EV[s]][1]+'</text>';
      } else {
        h += '<text x="'+p.x+'" y="'+(p.y+6)+'" text-anchor="middle" font-size="16" fill="'+col+'" opacity=".6">'+(ox ? '➜' : '⇢')+'</text>';
      }
    }
    // 棋子
    if(g){
      var tp = pos(g.sq), ox2 = g.cargo === 'O2';
      h += '<g transform="translate('+(tp.x-26)+' '+(tp.y-40)+')">' + CH3.mascots.rbc(52).replace(/#E53935/g, ox2 ? OXY : DEOXY) + '</g>';
      h += '<text x="'+(tp.x+20)+'" y="'+(tp.y-30)+'" font-size="13" font-weight="900" fill="'+(ox2?'#1565C0':'#5D4037')+'">'+(ox2?'O₂':'CO₂')+'</text>';
    }
    $('bd').innerHTML = h;
    if(g){
      $('stamps').textContent = g.stamps; $('acc').textContent = g.right + '/' + g.total;
      $('cargo').innerHTML = '目前位置：<span style="color:'+(oxySq(g.sq)?OXY:DEOXY)+'">'+(isStation(g.sq) ? '第 '+stNum(g.sq)+' 站 '+STN[stNum(g.sq)-1] : '血管中')+'</span><br>攜帶：'+(g.cargo === 'O2' ? '🔵 O₂（充氧血・鮮紅）' : '🟤 CO₂（缺氧血・暗紅）');
      $('mission').innerHTML = '<div class="'+(g.dO2?'ok':'')+'">'+(g.dO2?'✅':'⬜')+' 把 O₂ 送到 ④ 組織微血管</div><div class="'+(g.dCO2?'ok':'')+'">'+(g.dCO2?'✅':'⬜')+' 把 CO₂ 交到 ⑩ 肺微血管</div><div class="'+(g.dO2&&g.dCO2?'ok':'')+'">'+(g.dO2&&g.dCO2?'✅':'⬜')+' 回到 ① 左心室，蓋快遞章</div>';
    }
  }
  function log(t){ var l = $('log'); l.insertAdjacentHTML('afterbegin', '<p>'+t+'</p>'); }

  /* ---------- 遊戲流程 ---------- */
  var tm = null;
  $('startBtn').addEventListener('click', function(){
    g = newGame(); $('log').innerHTML = ''; log('🚩 從 ① 左心室出發，帶著 O₂！');
    $('rollBtn').disabled = false; this.textContent = '↺ 重新開始';
    clearInterval(tm); tm = setInterval(function(){
      if(g.over) return;
      g.time--; $('time').textContent = Math.floor(g.time/60) + ':' + ('0' + g.time%60).slice(-2);
      if(g.time <= 0) end();
    }, 1000);
    draw();
  });
  $('rollBtn').addEventListener('click', function(){
    if(!g || g.busy || g.over) return;
    g.busy = true; $('rollBtn').disabled = true;
    if(g.bleedLock){ bleed().then(done); return; }
    GAME.ask({ units:['3-2'], title:'答對才能擲骰子' }).then(function(ok){
      g.total++; if(ok) g.right++;
      if(!ok){ log('❌ 答錯了，這回合原地休息。'); done(); return; }
      var n = 1 + Math.floor(Math.random() * 3), k = 0;
      var roll = setInterval(function(){ $('dice').textContent = ['⚀','⚁','⚂'][k++ % 3]; if(k > 6){ clearInterval(roll); $('dice').textContent = ['⚀','⚁','⚂'][n-1] + ' ' + n; log('🎲 擲出 '+n+'，前進 '+n+' 格'); move(n).then(done); } }, UNIT.reduced() ? 20 : 90);
    });
  });
  function done(){ g.busy = false; draw(); if(!g.over) $('rollBtn').disabled = false; }
  function sleep(ms){ return new Promise(function(r){ setTimeout(r, UNIT.reduced() ? 40 : ms); }); }

  /* 走 n 格：離開站點時要選對下一站 */
  function move(n){
    var p = Promise.resolve(true);
    for(var i=0;i<n;i++) p = p.then(function(cont){
      if(!cont || g.over) return false;
      return leaveCheck().then(function(ok){ if(!ok) return false; return step(); });
    });
    return p.then(function(cont){ if(cont !== false && !g.over) return landEvent(); });
  }
  function leaveCheck(){
    if(!isStation(g.sq)) return Promise.resolve(true);
    var cur = stNum(g.sq), nxt = cur % 12 + 1;
    var wrongs = CH3.shuffle(STN.filter(function(_, i){ return i + 1 !== nxt && i + 1 !== cur; })).slice(0, 2);
    var opts = CH3.shuffle([STN[nxt-1]].concat(wrongs));
    var q = { id:'nav', unit:'3-2', type:'single', question:'🚦 你在第 '+cur+' 站「'+STN[cur-1]+'」，下一站是哪裡？', options:opts, answer:opts.indexOf(STN[nxt-1]), explain:STN[cur-1]+' → '+STN[nxt-1]+'。' + (cur <= 6 ? '（體循環：左心室→主動脈→小動脈→組織微血管→小靜脈→大靜脈→右心房）' : '（肺循環：右心室→肺動脈→肺微血管→肺靜脈→左心房）') };
    return GAME.ask({ question:q, title:'站點檢查', ngText:'被瓣膜擋回原地！' }).then(function(ok){
      if(!ok) log('🚫 第 '+cur+' 站選錯下一站，被<b>瓣膜</b>擋住了！');
      return ok;
    });
  }
  function step(){
    g.sq = (g.sq + 1) % 24; arrive(); draw(); UNIT.thump(240, .05, .25);
    return sleep(320).then(function(){ return true; });
  }
  function arrive(){
    if(g.sq === 6 && g.cargo === 'O2'){ g.cargo = 'CO2'; g.dO2 = true; log('🎁 在組織微血管：O₂ 交給細胞，帶走 CO₂ → 變成<b>缺氧血</b>'); }
    if(g.sq === 18 && g.cargo === 'CO2'){ g.cargo = 'O2'; if(g.dO2) g.dCO2 = true; log('🫁 在肺微血管：CO₂ 擴散到肺泡，帶回 O₂ → 變成<b>充氧血</b>'); }
    if(g.sq === 0){
      if(g.dO2 && g.dCO2){ g.stamps++; g.dO2 = g.dCO2 = false; log('📮 完成一次體循環＋肺循環，<b>蓋快遞章！</b>'); UNIT.thump(660, .2, .5); CH3.toast('📮 獲得快遞章！'); }
    }
  }
  function landEvent(){
    var e = EV[g.sq];
    if(e === 'run'){ log('🏃 跑完 800 公尺，<b>心搏加快</b>，多走 1 格！'); return sleep(400).then(step); }
    if(e === 'breath'){ log('🫁 深呼吸，氣體交換順利，多走 1 格！'); return sleep(400).then(step); }
    if(e === 'lymph'){
      log('💧 部分血漿滲出成<b>組織液</b>，你被帶進<b>淋巴管</b>支線，經淋巴結後匯入<b>靜脈</b>！');
      return sleep(700).then(function(){ g.sq = 10; draw(); log('➡ 從大靜脈回到血液循環。'); });
    }
    if(e === 'bleed'){ g.bleedLock = true; log('🩹 血管破裂！要答對<b>血小板</b>相關的題目才能通過。'); return bleed(); }
    return Promise.resolve();
  }
  function bleed(){
    return GAME.ask({ units:['3-2'], filter:function(q){ return /血小板|凝固|血球/.test(q.question + q.options.join('')); }, title:'🩹 血管破裂：血小板題' }).then(function(ok){
      g.total++; if(ok) g.right++;
      if(ok){ g.bleedLock = false; log('✅ 血小板促使血液凝固，傷口止血，可以繼續前進！'); }
      else log('❌ 還在流血……下回合要再答一次。');
    });
  }
  function end(){
    g.over = true; clearInterval(tm); $('rollBtn').disabled = true;
    var b = GAME.best('bloodRun', g.stamps);
    var acc = g.total ? Math.round(g.right / g.total * 100) : 0;
    var m = GAME.modal('<h2 style="text-align:center">⏰ 時間到！</h2><div style="text-align:center;font-size:3rem">📮 × '+g.stamps+'</div>' +
      '<p style="text-align:center">答對率 '+acc+'%・最佳紀錄 '+b.best+' 個章'+(b.isNew && g.stamps > 0 ? '（新紀錄！）' : '')+'</p>' +
      '<p style="background:var(--u-l);padding:10px 14px;border-radius:12px">記得：體循環 <b>左心室 → … → 右心房</b>；肺循環 <b>右心室 → … → 左心房</b>。經過<b>組織微血管</b>變成缺氧血、經過<b>肺微血管</b>變成充氧血。</p>' +
      '<div style="display:flex;gap:10px;justify-content:center"><button class="btn ghost" data-lobby>🎮 遊戲大廳</button><button class="btn blood" data-again>↺ 再玩一次</button></div>');
    m.el.querySelector('[data-again]').addEventListener('click', function(){ m.close(); $('startBtn').click(); });
    if(g.stamps >= 2) GAME.unlock('courier');
  }
  var STEPS = ['你是一顆<b>紅血球快遞員</b>，從 <b>① 左心室</b> 出發，身上帶著 O₂。',
    '按「<b>答題擲骰子</b>」：答對才能擲骰，前進 1～3 格。',
    '要<b>離開站點</b>時，必須選對「下一站」，選錯就被<b>瓣膜</b>擋回原地！',
    '經過 <b>④ 組織微血管</b>交出 O₂、帶走 CO₂；經過 <b>⑩ 肺微血管</b>交出 CO₂、帶回 O₂。顏色會跟著變！',
    '踩到事件格：🏃 跑步心搏加快多走 1 格、🩹 血管破裂要答血小板題、💧 組織液漏出走淋巴管支線。',
    '完成一圈任務回到左心室，就得到 1 個<b>快遞章</b>。限時 5 分鐘！'];
  $('howBtn').addEventListener('click', function(){ GAME.intro('bloodrun', '🩸 血液快遞大冒險：玩法', STEPS); });
  g = null; draw();
  GAME.introOnce('bloodrun', '🩸 血液快遞大冒險：玩法', STEPS);
  GAME.inProgress = function(){ return !!(g && !g.over); };
})();
</script>
</body>
</html>
